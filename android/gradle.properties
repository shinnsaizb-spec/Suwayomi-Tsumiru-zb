org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m
# Independent modules/tasks run concurrently, and outputs are cached and
# reused across the 3 --split-per-abi variants, which otherwise redo most of
# the same Kotlin/Java compilation and resource processing three times.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
# Kept false: AGP 9 defaults to built-in Kotlin, but the third-party plugins
# this app depends on (e.g. fluttertoast, from the pub cache) still apply the
# Kotlin Gradle Plugin themselves, and AGP 9 refuses that combination:
#   "The 'org.jetbrains.kotlin.android' plugin is no longer required for
#    Kotlin support since AGP 9.0."
# false keeps the legacy KGP path, which Flutter 3.44+ supports for exactly
# this case (see the built-in Kotlin migration guide). Flip to true once every
# plugin in the dependency set has migrated.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
