# Lightweight release pipeline for this fork: Android APK + Windows zip only.
#
# Why not reuse `release-fork.yml`? That one builds six platforms, requires a
# pre-created draft release with hand-written notes, and only publishes when
# every platform succeeds — so one flaky iOS/Linux job leaves the release stuck
# as a draft (and a draft is invisible to `releases/latest`, which is what the
# in-app update check reads). This workflow covers the two platforms that are
# actually installed, generates the notes itself, and publishes directly.
#
# One-time setup — repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     base64 of the debug keystore used for local release builds
#   KEY_ALIAS           androiddebugkey
#   KEYSTORE_PASSWORD   android
#   KEY_PASSWORD        android
# The keystore must be the SAME one used for existing installs, or Android
# refuses to upgrade over them (signature mismatch).
#
# Release:
#   1. bump `version:` in pubspec.yaml (e.g. 1.4.1+60 — the build number must
#      also increase or Android rejects the APK)
#   2. push a matching tag:  git tag v1.4.1 && git push origin v1.4.1
#   Or run this workflow manually with a version number — it creates the tag.
name: Release (zb-manga)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 1.4.1）。留空则用当前 ref"
        required: false
        default: ""

permissions:
  contents: write

env:
  # `push` on a tag → github.ref_name is already "v1.4.1".
  # Manual run → build "v<version>" from the input.
  RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  pkg_name: zb-manga

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          tag="${RELEASE_TAG#v}"
          pubspec="$(grep -m1 '^version:' pubspec.yaml \
            | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::tag v$tag 与 pubspec.yaml 的 $pubspec 不一致"
            exit 1
          fi
          echo "版本一致：$pubspec"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 —— 到 Settings → Secrets and variables → Actions 添加 4 个签名 secrets（KEYSTORE_BASE64 / KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD）"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      # Generated sources are gitignored, so every job regenerates them.
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure signing
        working-directory: android
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > key.properties

      - name: Build
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/${pkg_name}-${RELEASE_TAG}-android-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/${pkg_name}-${RELEASE_TAG}-android-arm64-v8a.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 7

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        run: flutter build windows --release

      - name: Bundle the MSVC runtime and verify SQLite
        shell: pwsh
        run: |
          # Without these the window opens but never paints (blank white screen)
          # on machines without the VC++ Redistributable.
          $redist = vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\*.dll'
          Copy-Item $redist build\windows\x64\runner\Release\ -Force
          # A missing sqlite3.dll is the error-126 DB-open crash.
          $sqlite = Get-ChildItem build\windows\x64\runner\Release\ -Filter *.dll |
            Where-Object { $_.Name -match 'sqlite3' }
          if (-not $sqlite) {
            Get-ChildItem build\windows\x64\runner\Release\ | Select-Object Name
            throw "sqlite3 native library missing from the Windows bundle"
          }
          Write-Host "Bundled SQLite: $($sqlite.Name)"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\${env:pkg_name}-${env:RELEASE_TAG}-windows-x64.zip"
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/*.zip
          retention-days: 7

  publish:
    name: Publish release
    # Only when both platforms built: a release missing the APK is worse than
    # no release at all, because `releases/latest` would point at it.
    needs: [android, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          # Published straight away (no draft): the in-app update check reads
          # `releases/latest`, which ignores drafts and pre-releases.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
